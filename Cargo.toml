[package]
name = "human-exception"
version = "0.5.0"
edition = "2024"
description = "A terminal-native strategy game about hacking the machines that inherited the Earth"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slaptijack/human-exception"
readme = "README.md"
keywords = ["game", "terminal", "strategy", "lua"]
categories = ["games"]

[lib]
name = "human_exception"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-code-editor = "0.0.6"
unicode-segmentation = "1.13"
unicode-width = "0.2"
